<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎主页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f4f9 0%, #e0eafc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-size: 3em;
            border-bottom: 2px solid #007BFF;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #007BFF;
            color: #fff;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1.1em;
            transition: all 0.3s ease;
            margin: 10px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* 文档查看器样式 */
        #docViewer {
            display: none;
            margin-top: 30px;
            text-align: left;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            max-height: 500px;
            overflow-y: auto;
        }

        #docViewer h1, #docViewer h2, #docViewer h3 {
            color: #333;
            margin-top: 20px;
        }

        #docViewer pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }

        #docViewer code {
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
        }

        .close-btn {
            float: right;
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        /* 新增视频播放器样式 */
        #videoPlayer {
            display: none;
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
        }
        
        #videoElement {
            width: 100%;
            border-radius: 5px;
        }
    </style>
    <!-- 引入Markdown解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>Welcome to my 主页</h1>
        <p>感谢您访问我的主页！在这里您可以发现更多有趣的内容。</p>
        
        <button id="downloadBtn" class="btn">下载文件</button>
        <button id="viewDocBtn" class="btn">查看文档</button>
        <button id="viewVideoBtn" class="btn">观看视频</button>
        <a href="#" class="btn">了解更多</a>
        
        <!-- 文档查看器 -->
        <div id="docViewer">
            <button class="close-btn" id="closeDocBtn">×</button>
            <div id="docContent"></div>
        </div>

        <!-- 新增视频播放器 -->
        <div id="videoPlayer">
            <video id="videoElement" controls>
                您的浏览器不支持HTML5视频
            </video>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const downloadBtn = document.getElementById('downloadBtn');
            const viewDocBtn = document.getElementById('viewDocBtn');
            const viewVideoBtn = document.getElementById('viewVideoBtn');
            const docViewer = document.getElementById('docViewer');
            const docContent = document.getElementById('docContent');
            const closeDocBtn = document.getElementById('closeDocBtn');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoElement = document.getElementById('videoElement');

            // 下载文件功能
            downloadBtn.addEventListener('click', function () {
                fetch('http://192.168.29.133:39333/download',{
                    credentials: 'include'
                }) 
                   .then(response => {
                        if (response.ok) {
                            return response.blob(); 
                        }
                        throw new Error('网络请求失败');
                    })
                   .then(blob => {
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'star.png'; 
                        a.click();
                        window.URL.revokeObjectURL(url);
                    })
                   .catch(error => {
                        console.error('下载失败:', error);
                        alert('下载失败: ' + error.message);
                    });
            });

            // 查看文档功能
            viewDocBtn.addEventListener('click', function () {
                fetch('http://192.168.29.133:39333/document.md',{
                    credentials: 'include'
                })
                    .then(response => {
                        if (response.ok) {
                            return response.text();
                        }
                        throw new Error('获取文档失败');
                    })
                    .then(text => {
                        docContent.innerHTML = marked.parse(text);
                        docViewer.style.display = 'block';
                        videoPlayer.style.display = 'none';
                    })
                    .catch(error => {
                        console.error('获取文档失败:', error);
                        alert('获取文档失败: ' + error.message);
                    });
            });

            // 观看视频功能
            viewVideoBtn.addEventListener('click', function() {
                // 隐藏文档查看器
                docViewer.style.display = 'none';
                
                // 显示视频播放器
                videoPlayer.style.display = 'block';
                
                // 设置视频源（假设服务端视频地址为/video）
                videoElement.src = 'http://192.168.29.133:39333/video.mp4';
                
                // 加载视频
                videoElement.load();
                
                // 尝试自动播放（注意：某些浏览器可能阻止自动播放）
                videoElement.play().catch(e => {
                    console.log('自动播放被阻止，用户需要手动点击播放');
                });
            });

            // 关闭文档查看器
            closeDocBtn.addEventListener('click', function() {
                docViewer.style.display = 'none';
            });
        });
    </script>
</body>

</html>
