<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录与注册</title>
    <!-- 添加 favicon.ico 链接 -->
    <link rel="icon" href="http://192.168.29.133:8888/favicon.ico" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        .switch-form {
            margin-top: 20px;
            cursor: pointer;
            color: #007bff;
        }

        .switch-form:hover {
            text-decoration: underline;
        }

        .success-message {
            color: green;
            margin-top: 10px;
        }

        .success-button {
            margin-top: 10px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .success-button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 id="form-title">登录</h2>
        <form id="login-form">
            <input type="text" id="username" name="username" placeholder="用户名" required>
            <input type="password" id="password" name="password" placeholder="密码" required>
            <input type="submit" value="登录">
        </form>
        <form id="register-form" style="display: none;">
            <input type="text" id="reg-username" name="username" placeholder="用户名" required>
            <input type="password" id="reg-password" name="password" placeholder="密码" required>
            <input type="password" id="reg-confirm-password" name="confirm-password" placeholder="确认密码" required>
            <input type="submit" value="注册">
        </form>
        <p id="response-message" style="color: red; margin-top: 10px;"></p>
        <p class="switch-form" id="switch-to-register">没有账号？点击注册</p>
        <p class="switch-form" id="switch-to-login" style="display: none;">已有账号？点击登录</p>
        <!-- 注册成功后的跳转按钮 -->
        <div id="success-message" style="display: none;">
            <p class="success-message">注册成功！</p>
            <button class="success-button" id="go-to-login">跳转到登录页面</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const switchToRegister = document.getElementById('switch-to-register');
        const switchToLogin = document.getElementById('switch-to-login');
        const formTitle = document.getElementById('form-title');
        const responseMessage = document.getElementById('response-message');
        const successMessage = document.getElementById('success-message');
        const goToLoginButton = document.getElementById('go-to-login');

        // 切换表单显示
        switchToRegister.addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            switchToRegister.style.display = 'none';
            switchToLogin.style.display = 'block';
            formTitle.textContent = '注册';
            responseMessage.textContent = '';
            successMessage.style.display = 'none'; // 隐藏成功消息
        });

        switchToLogin.addEventListener('click', () => {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            switchToRegister.style.display = 'block';
            switchToLogin.style.display = 'none';
            formTitle.textContent = '登录';
            responseMessage.textContent = '';
            successMessage.style.display = 'none'; // 隐藏成功消息
        });

        // 处理登录表单提交
        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('http://192.168.29.133:8888/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
            })
                .then(response => {
                    if (response.redirected) {
                        window.location.href = response.url;
                    } else if (response.ok) {
                        responseMessage.textContent = '登录成功！';
                        responseMessage.style.color = 'green';
                    } else {
                        // 登录失败，显示错误信息
                        return response.json().then(data => {
                            responseMessage.textContent = data.message || '登录失败，请检查用户名和密码';
                            responseMessage.style.color = 'red';
                        });
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                    responseMessage.textContent = '请求失败，请检查网络连接';
                    responseMessage.style.color = 'red';
                });
        });

        // 处理注册表单提交
        registerForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                responseMessage.textContent = '两次输入的密码不一致，请重新输入';
                responseMessage.style.color = 'red';
                return;
            }

            fetch('http://192.168.29.133:8888/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
            })
                .then(response => {
                    if (response.ok) {
                        // 注册成功，显示成功消息和跳转按钮
                        registerForm.style.display = 'none';
                        successMessage.style.display = 'block';
                        responseMessage.textContent = '';
                    } else {
                        responseMessage.textContent = '注册失败，请稍后重试';
                        responseMessage.style.color = 'red';
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                    responseMessage.textContent = '请求失败，请检查网络连接';
                    responseMessage.style.color = 'red';
                });
        });

        // 跳转到登录页面
        goToLoginButton.addEventListener('click', () => {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            switchToRegister.style.display = 'block';
            switchToLogin.style.display = 'none';
            formTitle.textContent = '登录';
            successMessage.style.display = 'none'; // 隐藏成功消息
        });
    </script>
</body>

</html>
